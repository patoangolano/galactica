/** Checks every jar of a configuration against a set of pinned SHA-512s; {@code exact} also requires every pin to be used. */
def verifyStackJars(String name, Configuration stack, Set pins, boolean exact) {
    def files = stack.files
    files.each { jar ->
        def digest = java.security.MessageDigest.getInstance('SHA-512')
        jar.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int read
            while ((read = input.read(buffer)) > 0) digest.update(buffer, 0, read)
        }
        def actual = digest.digest().encodeHex().toString()
        if (!pins.contains(actual)) throw new GradleException("${name}: ${jar.name} has SHA-512 ${actual}, not a pinned Modrinth hash")
        logger.lifecycle("${name}: ${jar.name} OK")
    }
    if (exact && files.size() != pins.size()) throw new GradleException("${name}: ${files.size()} jars, expected ${pins.size()}")
}

tasks.register('verifyTectonicStack') {
    description = 'Checks the Tectonic-run jars against their pinned Modrinth SHA-512s.'
    def stack = configurations.tectonicStack
    inputs.files(stack)
    doLast { verifyStackJars('tectonic stack', stack, tectonicStackSha512, false) }
}

tasks.register('verifyDhStack') {
    description = 'Checks the Distant Horizons-run jars against their pinned Modrinth SHA-512s.'
    def stack = configurations.dhStack
    inputs.files(stack)
    doLast { verifyStackJars('dh stack', stack, dhStackSha512, false) }
}

tasks.register('verifyPerfStack') {
    description = 'Checks every performance-stack jar against its pinned Modrinth SHA-512.'
    def stack = configurations.perfStack
    inputs.files(stack)
    doLast {
        def files = stack.files
        files.each { jar ->
            def digest = java.security.MessageDigest.getInstance('SHA-512')
            jar.withInputStream { input ->
                byte[] buffer = new byte[65536]
                int read
                while ((read = input.read(buffer)) > 0) digest.update(buffer, 0, read)
            }
            def actual = digest.digest().encodeHex().toString()
            if (!perfStackSha512.contains(actual)) throw new GradleException("perf stack: ${jar.name} has SHA-512 ${actual}, not a pinned Modrinth hash")
            logger.lifecycle("perf stack: ${jar.name} OK")
        }
        if (files.size() != perfStackSha512.size()) throw new GradleException("perf stack: ${files.size()} jars, expected ${perfStackSha512.size()}")
    }
}

afterEvaluate {
    def perf = sourceSets.create('perf')
    perf.compileClasspath = sourceSets.main.compileClasspath
    perf.runtimeClasspath = sourceSets.main.runtimeClasspath + configurations.perfStack
    loom.runs.create('playPerf') {
        client()
        configName = 'Galactica Play (performance stack)'
        runDir 'runs/play'
        vmArgs '-Xmx4G'
        source perf
    }
    loom.runs.create('autotestPerfStack') {
        client()
        configName = 'Galactica Autotest + perf benchmark (performance stack)'
        runDir 'runs/client-perf'
        vmArgs '-Xmx4G', '-Dgalactica.autotest=true', '-Dgalactica.autotest.perf=true', '-Dgalactica.autotest.tag=perfstack'
        programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1600', '--height', '900'
        source perf
    }
    tasks.matching { it.name in ['runPlayPerf', 'runAutotestPerfStack'] }.configureEach { dependsOn 'verifyPerfStack' }

    // Tectonic Earth: its own folder and world (Tectonic reshapes the Overworld of every world it loads in).
    //   ./gradlew runPlayTectonic           manual play in runs/play-tectonic
    //   ./gradlew runAutotestTectonic       Earth entry/exit and screenshots under Tectonic, in runs/client-tectonic
    def tectonic = sourceSets.create('tectonic')
    tectonic.compileClasspath = sourceSets.main.compileClasspath
    tectonic.runtimeClasspath = sourceSets.main.runtimeClasspath + configurations.tectonicStack
    loom.runs.create('playTectonic') {
        client()
        configName = 'Galactica Play (Tectonic Earth)'
        runDir 'runs/play-tectonic'
        vmArgs '-Xmx4G'
        source tectonic
    }
    loom.runs.create('autotestTectonic') {
        client()
        configName = 'Galactica Autotest (Tectonic Earth)'
        runDir 'runs/client-tectonic'
        vmArgs '-Xmx4G', '-Dgalactica.autotest=true', '-Dgalactica.autotest.mode=tectonic', '-Dgalactica.autotest.tag=tectonic'
        programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1600', '--height', '900'
        source tectonic
    }
    // Distant Horizons with the rendering mods: tall planet terrain and Earth out to the LOD horizon.
    //   ./gradlew runAutotestDh             terrain tour (Mars, an Earth-like world, the Moon, Earth) in runs/client-dh
    def dh = sourceSets.create('dh')
    dh.compileClasspath = sourceSets.main.compileClasspath
    dh.runtimeClasspath = sourceSets.main.runtimeClasspath + configurations.dhStack
    loom.runs.create('playDh') {
        client()
        configName = 'Galactica Play (Distant Horizons + rendering mods)'
        runDir 'runs/play'
        vmArgs '-Xmx6G'
        source dh
    }
    loom.runs.create('autotestDh') {
        client()
        configName = 'Galactica Autotest (Distant Horizons terrain tour)'
        runDir 'runs/client-dh'
        vmArgs '-Xmx6G', '-Dgalactica.autotest=true', '-Dgalactica.autotest.mode=terrain', '-Dgalactica.autotest.tag=dh'
        programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1600', '--height', '900'
        source dh
    }
    tasks.matching { it.name in ['runPlayTectonic', 'runAutotestTectonic'] }.configureEach { dependsOn 'verifyTectonicStack' }
    tasks.matching { it.name in ['runPlayDh', 'runAutotestDh'] }.configureEach { dependsOn 'verifyDhStack' }
}
