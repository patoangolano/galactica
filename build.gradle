plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.18.1'
}

base {
    archivesName = mod_id
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

/** Returns the mcpfabric jar when the path property is set and the file matches the pinned SHA-256, else null. */
def verifiedMcpfabricJar() {
    def path = project.findProperty('galactica.mcpfabricJar')
    if (path == null || path.toString().isBlank()) {
        return null
    }
    def jar = file(path.toString())
    if (!jar.isFile()) {
        logger.warn("galactica: mcpfabric jar not found at ${jar}; dev runs start without it")
        return null
    }
    def expected = mcpfabric_sha256.toString().trim().toLowerCase(Locale.ROOT)
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    jar.withInputStream { input ->
        byte[] buffer = new byte[65536]
        int read
        while ((read = input.read(buffer)) > 0) {
            digest.update(buffer, 0, read)
        }
    }
    def actual = digest.digest().encodeHex().toString()
    if (actual != expected) {
        logger.warn("galactica: mcpfabric jar ${jar} has SHA-256 ${actual}, expected ${expected}; NOT added to the run classpath")
        return null
    }
    return jar
}

configurations {
    // Resolved on its own (transitive deps off: each jar bundles what it needs, Fabric API comes from the main runtime).
    perfStack { transitive = false }
    // Earth terrain overhaul for the Tectonic runs (README "Terreno"): Tectonic + Lithostitched, Terralith on request.
    tectonicStack { transitive = false }
    // Distant Horizons runs: DH plus the client rendering mods tested next to it (Sodium Extra, Bobby, Nvidium on request).
    dhStack { transitive = false }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    // Shader compatibility hooks only; Iris is optional at runtime.
    compileOnly("maven.modrinth:iris:${iris_version}")
    // Optional animated ship renderer (client/ship/geckolib); GeckoLib 5.5.7 for Fabric 26.3, Modrinth version id kSxHvs99, MIT.
    compileOnly("maven.modrinth:geckolib:kSxHvs99")

    // --- Optional integrations: compile against them, never ship or require them (fabric.mod.json "suggests").
    // 26.x is unobfuscated, so plain compileOnly works; no mod* remap configurations exist or are needed.
    compileOnly("maven.modrinth:modmenu:${modmenu_version}")          // MIT; entrypoint compat/modmenu
    compileOnly("maven.modrinth:yacl:${yacl_version}")                // LGPL-3.0+; mod id yet_another_config_lib_v3
    compileOnly("maven.modrinth:distanthorizonsapi:${dh_api_version}") // DH API jar (sources inside); runtime mod id distanthorizons
    compileOnly("maven.modrinth:geckolib:${geckolib_version}")        // MIT; detection only for now (OptionalMods.geckolib)
    compileOnly("maven.modrinth:entityculling:${perf_entityculling}") // tr7zw custom license; whitelist API only (compat/entityculling)

    // --- Dev runtime only (localRuntime: on the run classpath, never in the published POM/jar).
    localRuntime("maven.modrinth:modmenu:${modmenu_version}")
    localRuntime("maven.modrinth:yacl:${yacl_version}")
    localRuntime("maven.modrinth:spark:${spark_version}")             // GPL-3.0 profiler, runtime tool, not linked
    // mcpfabric agent bridge (research C.3 provenance gate): the jar path is per machine and comes from
    // -Pgalactica.mcpfabricJar=... or ~/.gradle/gradle.properties, never from this repo. The jar joins the
    // run classpath only when its SHA-256 equals the hash pinned in gradle.properties (mcpfabric_sha256).
    def mcpfabricJar = verifiedMcpfabricJar()
    if (mcpfabricJar != null) {
        localRuntime(files(mcpfabricJar))
    }
    // Heavy renderers are opt-in so the autotest screenshots stay comparable:
    //   ./gradlew runClient -Pgalactica.dh=true      (Distant Horizons LOD terrain)
    //   ./gradlew runClient -Pgalactica.bobby=true   (Bobby chunk cache)
    if (project.findProperty('galactica.dh') == 'true') {
        localRuntime("maven.modrinth:distanthorizons:${dh_version}")
    }
    if (project.findProperty('galactica.bobby') == 'true') {
        localRuntime("maven.modrinth:bobby:${bobby_version}")
    }

    // Performance-mod stack for the playPerf and autotestPerfStack runs only (their own source set, below): never on
    // the main classpath and never shipped. Pinned by Modrinth version id; the SHA-512s are checked by verifyPerfStack.
    perfStack("maven.modrinth:sodium:${perf_sodium}")
    perfStack("maven.modrinth:lithium:${perf_lithium}")
    perfStack("maven.modrinth:ferrite-core:${perf_ferritecore}")
    perfStack("maven.modrinth:immediatelyfast:${perf_immediatelyfast}")
    perfStack("maven.modrinth:entityculling:${perf_entityculling}")
    perfStack("maven.modrinth:c2me-fabric:${perf_c2me}")
    perfStack("maven.modrinth:krypton:${perf_krypton}")
    perfStack("maven.modrinth:modernfix-mvus:${perf_modernfix}") // ModernFix-mVUS: the 26.x fork; upstream ModernFix stops at 1.21
    perfStack("maven.modrinth:scalablelux:${perf_scalablelux}")     // parallel light engine: the lighting cost of the tall planet slots

    // Tectonic (MIT) and its library Lithostitched (MIT) reshape the Overworld = Earth. Never bundled: "suggests" only.
    // Terralith (Stardust Labs licence, never bundled or copied) joins with -Pgalactica.terralith=true.
    tectonicStack("maven.modrinth:tectonic:${tectonic_version}")
    tectonicStack("maven.modrinth:lithostitched:${lithostitched_version}")
    if (project.findProperty('galactica.terralith') == 'true') {
        tectonicStack("maven.modrinth:terralith:${terralith_version}")
    }
    dhStack("maven.modrinth:distanthorizons:${dh_version}")
    dhStack("maven.modrinth:sodium-extra:${sodium_extra_version}")
    dhStack("maven.modrinth:bobby:${bobby_version}")
    // Nvidium replaces Sodium's terrain renderer on NVIDIA Turing+ only (it disables itself elsewhere): opt-in.
    if (project.findProperty('galactica.nvidium') == 'true') {
        dhStack("maven.modrinth:nvidium:${nvidium_version}")
    }

    testImplementation(platform('org.junit:junit-bom:5.13.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

test {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

loom {
    runs {
        client {
            client()
            configName = 'Galactica Client'
            runDir 'runs/client'
            vmArgs '-Xmx4G'
        }
        // Manual play: its own folder, so autotests running in parallel never share a world or options.
        play {
            client()
            configName = 'Galactica Play'
            runDir 'runs/play'
            vmArgs '-Xmx4G'
        }
        autotest {
            client()
            configName = 'Galactica Autotest'
            runDir 'runs/client'
            vmArgs '-Xmx4G', '-Dgalactica.autotest=true'
            programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1600', '--height', '900'
        }
        // Full autotest followed by the performance benchmark (PerfBench: [perf] lines in the log).
        autotestPerf {
            client()
            configName = 'Galactica Autotest + perf benchmark'
            runDir 'runs/client'
            vmArgs '-Xmx4G', '-Dgalactica.autotest=true', '-Dgalactica.autotest.perf=true'
            programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1600', '--height', '900'
        }
        // The benchmark scenes alone.
        autotestPerfOnly {
            client()
            configName = 'Galactica perf benchmark'
            runDir 'runs/client'
            vmArgs '-Xmx4G', '-Dgalactica.autotest=true', '-Dgalactica.autotest.mode=perf'
            programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1600', '--height', '900'
        }
        autotestIris {
            client()
            configName = 'Galactica Autotest (Iris)'
            runDir 'runs/client-iris'
            vmArgs '-Xmx4G', '-Dgalactica.autotest=true', '-Dgalactica.autotest.tag=iris'
            programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1600', '--height', '900'
        }
        autotestVenus {
            client()
            configName = 'Galactica Autotest (Venus)'
            runDir 'runs/client'
            vmArgs '-Xmx4G', '-Dgalactica.autotest=true', '-Dgalactica.autotest.mode=venus'
            programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1600', '--height', '900'
        }
        // The tall-terrain screenshot tour (Mars, an Earth-like world, the Moon) without Distant Horizons.
        autotestTerrain {
            client()
            configName = 'Galactica Autotest (terrain tour)'
            runDir 'runs/client'
            vmArgs '-Xmx4G', '-Dgalactica.autotest=true', '-Dgalactica.autotest.mode=terrain'
            programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1600', '--height', '900'
        }
        // The orbital-frame checks alone (AutoTest "soi" mode; the default run ends with them too).
        autotestSoi {
            client()
            configName = 'Galactica Autotest (SOI)'
            runDir 'runs/client'
            vmArgs '-Xmx4G', '-Dgalactica.autotest=true', '-Dgalactica.autotest.mode=soi'
            programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1600', '--height', '900'
        }
        // The 3D map and autopilot checks alone (AutoTest "nav" mode; the default run ends with them too).
        autotestNav {
            client()
            configName = 'Galactica Autotest (3D map + autopilot)'
            runDir 'runs/client'
            vmArgs '-Xmx4G', '-Dgalactica.autotest=true', '-Dgalactica.autotest.mode=nav'
            programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1600', '--height', '900'
        }
        // Block-built ships alone (AutoTest "ships" mode; the default run ends with them too).
        autotestShips {
            client()
            configName = 'Galactica Autotest (built ships)'
            runDir 'runs/client'
            vmArgs '-Xmx4G', '-Dgalactica.autotest=true', '-Dgalactica.autotest.mode=ships'
            programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1600', '--height', '900'
        }
        showcase {
            client()
            configName = 'Galactica Showcase take'
            runDir 'runs/client-iris'
            vmArgs '-Xmx4G', '-Dgalactica.autotest=true', '-Dgalactica.autotest.mode=showcase'
            programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1920', '--height', '1080'
        }
        server {
            server()
            configName = 'Galactica Server'
            runDir 'runs/server'
        }
    }
}

// Fabric GameTest wiring (Loom 1.18.1 FabricApiExtension/GameTestSettings, read from the plugin jar).
// Creates the `gametest` source set (src/gametest/java + resources, depends on main) and the
// runGameTest (server, headless) and runClientGameTest (real client window) tasks.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'galactica-test'
        eula = true
        enableGameTests = true
        enableClientGameTests = true
    }
}

// Loom hooks runGameTest into `check`, which would boot a server inside every `./gradlew build`.
// Keep build fast and offline-safe; run the game tests explicitly instead, but still compile them.
tasks.named('check') {
    setDependsOn(dependsOn.findAll { !it.toString().contains('GameTest') })
    dependsOn 'gametestClasses'
}

processResources {
    def props = [version: version, mod_id: mod_id, mod_name: mod_name, mod_author: mod_author, license: license,
                 description: description, minecraft_version: minecraft_version,
                 fabric_loader_version: fabric_loader_version, java_version: java_version]
    inputs.properties props
    filesMatching(['fabric.mod.json', '*.mixins.json']) { expand props }
}

// "bridge" dev run: the client plus the mcbridge mod (MIT, tomda; ported to 26.3 in ../tools/mcbridge-26.3) so
// the mcbridge MCP can see and drive the game. The jar sits on the bridge source set only: every other run keeps
// its classpath. Override the jar with -Pgalactica.mcbridgeJar=<path>.
afterEvaluate {
    def bridgeJar = file(findProperty('galactica.mcbridgeJar') ?: '../tools/mcbridge-26.3/mcbridge-0.1.0+26.3.jar')
    if (!bridgeJar.isFile()) return
    def bridge = sourceSets.create('bridge')
    bridge.compileClasspath = sourceSets.main.compileClasspath
    bridge.runtimeClasspath = sourceSets.main.runtimeClasspath + files(bridgeJar)
    loom.runs.create('bridge') {
        client()
        configName = 'Galactica Bridge'
        runDir 'runs/bridge'
        vmArgs '-Xmx4G'
        programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1600', '--height', '900'
        source bridge
    }
}

