plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.18.1'
}

base {
    archivesName = mod_id
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    // Shader compatibility hooks only; Iris is optional at runtime.
    compileOnly("maven.modrinth:iris:${iris_version}")

    // --- Optional integrations: compile against them, never ship or require them (fabric.mod.json "suggests").
    // 26.x is unobfuscated, so plain compileOnly works; no mod* remap configurations exist or are needed.
    compileOnly("maven.modrinth:modmenu:${modmenu_version}")          // MIT; entrypoint compat/modmenu
    compileOnly("maven.modrinth:yacl:${yacl_version}")                // LGPL-3.0+; mod id yet_another_config_lib_v3
    compileOnly("maven.modrinth:distanthorizonsapi:${dh_api_version}") // DH API jar (sources inside); runtime mod id distanthorizons
    compileOnly("maven.modrinth:geckolib:${geckolib_version}")        // MIT; detection only for now (OptionalMods.geckolib)

    // --- Dev runtime only (localRuntime: on the run classpath, never in the published POM/jar).
    localRuntime("maven.modrinth:modmenu:${modmenu_version}")
    localRuntime("maven.modrinth:yacl:${yacl_version}")
    localRuntime("maven.modrinth:spark:${spark_version}")             // GPL-3.0 profiler, runtime tool, not linked
    if (file(mcpfabric_jar).exists()) {
        localRuntime(files(mcpfabric_jar))                              // SHA-256 checked against SHA256SUMS.expected
    }
    // Heavy renderers are opt-in so the autotest screenshots stay comparable:
    //   ./gradlew runClient -Pgalactica.dh=true      (Distant Horizons LOD terrain)
    //   ./gradlew runClient -Pgalactica.bobby=true   (Bobby chunk cache)
    if (project.findProperty('galactica.dh') == 'true') {
        localRuntime("maven.modrinth:distanthorizons:${dh_version}")
    }
    if (project.findProperty('galactica.bobby') == 'true') {
        localRuntime("maven.modrinth:bobby:${bobby_version}")
    }

    testImplementation(platform('org.junit:junit-bom:5.13.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

test {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

loom {
    runs {
        client {
            client()
            configName = 'Galactica Client'
            runDir 'runs/client'
            vmArgs '-Xmx4G'
        }
        autotest {
            client()
            configName = 'Galactica Autotest'
            runDir 'runs/client'
            vmArgs '-Xmx4G', '-Dgalactica.autotest=true'
            programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1600', '--height', '900'
        }
        autotestIris {
            client()
            configName = 'Galactica Autotest (Iris)'
            runDir 'runs/client-iris'
            vmArgs '-Xmx4G', '-Dgalactica.autotest=true', '-Dgalactica.autotest.tag=iris'
            programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1600', '--height', '900'
        }
        autotestVenus {
            client()
            configName = 'Galactica Autotest (Venus)'
            runDir 'runs/client'
            vmArgs '-Xmx4G', '-Dgalactica.autotest=true', '-Dgalactica.autotest.mode=venus'
            programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1600', '--height', '900'
        }
        showcase {
            client()
            configName = 'Galactica Showcase take'
            runDir 'runs/client-iris'
            vmArgs '-Xmx4G', '-Dgalactica.autotest=true', '-Dgalactica.autotest.mode=showcase'
            programArgs '--quickPlaySingleplayer', 'galactica_test', '--width', '1920', '--height', '1080'
        }
        server {
            server()
            configName = 'Galactica Server'
            runDir 'runs/server'
        }
    }
}

// Fabric GameTest wiring (Loom 1.18.1 FabricApiExtension/GameTestSettings, read from the plugin jar).
// Creates the `gametest` source set (src/gametest/java + resources, depends on main) and the
// runGameTest (server, headless) and runClientGameTest (real client window) tasks.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'galactica-test'
        eula = true
        enableGameTests = true
        enableClientGameTests = true
    }
}

// Loom hooks runGameTest into `check`, which would boot a server inside every `./gradlew build`.
// Keep build fast and offline-safe; run the game tests explicitly instead, but still compile them.
tasks.named('check') {
    setDependsOn(dependsOn.findAll { !it.toString().contains('GameTest') })
    dependsOn 'gametestClasses'
}

processResources {
    def props = [version: version, mod_id: mod_id, mod_name: mod_name, mod_author: mod_author, license: license,
                 description: description, minecraft_version: minecraft_version,
                 fabric_loader_version: fabric_loader_version, java_version: java_version]
    inputs.properties props
    filesMatching(['fabric.mod.json', '*.mixins.json']) { expand props }
}
